<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b241d"/>
      <stop offset="65%" stop-color="#3d332a"/>
      <stop offset="100%" stop-color="#241e18"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1712"/>
      <stop offset="100%" stop-color="#0f0b09"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.32"/>
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.65"/>
    </radialGradient>
  </defs>

  <!-- BACK WALL & FLOOR -->
  <rect width="1280" height="530" fill="url(#wallGrad)"/>
  <rect y="530" width="1280" height="190" fill="url(#floorGrad)"/>
  <line x1="0" y1="530" x2="1280" y2="530" stroke="#120e0a" stroke-width="6"/>

  <!-- WALLPAPER STRIPES & CRACKS -->
  <g stroke="#231c16" stroke-width="2" opacity="0.5">
    <line x1="160" y1="0" x2="160" y2="530"/>
    <line x1="320" y1="0" x2="320" y2="530"/>
    <line x1="480" y1="0" x2="480" y2="530"/>
    <line x1="640" y1="0" x2="640" y2="530"/>
    <line x1="800" y1="0" x2="800" y2="530"/>
    <line x1="960" y1="0" x2="960" y2="530"/>
    <line x1="1120" y1="0" x2="1120" y2="530"/>
  </g>

  <!-- 1. PINTU KAMAR 404 (LEFT-SIDE DOOR - INTERACTIVE) -->
  <g id="Door404">
    <rect x="48" y="135" width="145" height="395" fill="#211610" stroke="#0d0907" stroke-width="6"/>
    <rect x="60" y="148" width="121" height="370" fill="#472e1f" stroke="#17100b" stroke-width="4"/>
    <rect x="74" y="168" width="93" height="130" fill="#3b2518" stroke="#24160e" stroke-width="3"/>
    <rect x="74" y="325" width="93" height="165" fill="#3b2518" stroke="#24160e" stroke-width="3"/>
    <!-- Peephole & Plate 404 -->
    <circle cx="120" cy="210" r="6" fill="#0f0b09" stroke="#d4af37" stroke-width="2"/>
    <rect x="92" y="230" width="56" height="26" rx="3" fill="#facc15" stroke="#1c1917" stroke-width="2.5"/>
    <text x="120" y="249" font-family="Impact, sans-serif" font-size="18" fill="#1c1917" text-anchor="middle">404</text>
    <!-- Doorknob & Lock -->
    <circle cx="164" cy="340" r="9" fill="#f59e0b" stroke="#1c1917" stroke-width="2.5"/>
    <!-- Wooden Barricade Planks -->
    <rect x="40" y="275" width="162" height="22" rx="2" transform="rotate(-4 120 285)" fill="#784b27" stroke="#1c1917" stroke-width="3"/>
    <rect x="40" y="405" width="162" height="22" rx="2" transform="rotate(3 120 415)" fill="#784b27" stroke="#1c1917" stroke-width="3"/>
  </g>

  <!-- 2. LEMARI LOGISTIK / RAK PERSEDIAAN (MID-LEFT - INTERACTIVE ITEMS) -->
  <g id="SupplyCabinet">
    <rect x="220" y="165" width="165" height="365" fill="#2c1d12" stroke="#120c07" stroke-width="5"/>
    <rect x="230" y="178" width="145" height="340" fill="#1b120c"/>
    <!-- Shelves -->
    <rect x="225" y="255" width="155" height="12" fill="#4a3221" stroke="#120c07" stroke-width="3"/>
    <rect x="225" y="345" width="155" height="12" fill="#4a3221" stroke="#120c07" stroke-width="3"/>
    <rect x="225" y="435" width="155" height="12" fill="#4a3221" stroke="#120c07" stroke-width="3"/>
    <!-- Label -->
    <rect x="255" y="140" width="95" height="22" rx="3" fill="#1c1917" stroke="#78716c" stroke-width="1.5"/>
    <text x="302" y="155" font-family="monospace" font-weight="bold" font-size="11" fill="#e7e5e4" text-anchor="middle">LEMARI STOK</text>
  </g>

  <!-- 3. JENDELA APARTEMEN LANTAI 4 & MEJA RADIO (CENTER) -->
  <g id="WindowAndRadioTable">
    <!-- Window Frame -->
    <rect x="435" y="125" width="235" height="195" fill="#0d131a" stroke="#1f1610" stroke-width="8"/>
    <!-- Red Lockdown Sky Outside -->
    <rect x="443" y="133" width="219" height="179" fill="#2a0f12"/>
    <!-- Distant City Silhouette -->
    <rect x="455" y="210" width="38" height="102" fill="#12080a"/>
    <rect x="500" y="185" width="48" height="127" fill="#160a0c"/>
    <rect x="560" y="225" width="42" height="87" fill="#12080a"/>
    <rect x="610" y="195" width="40" height="117" fill="#160a0c"/>
    <!-- Window Crossbars & Planks -->
    <line x1="552" y1="125" x2="552" y2="320" stroke="#1f1610" stroke-width="6"/>
    <line x1="435" y1="222" x2="670" y2="222" stroke="#1f1610" stroke-width="6"/>

    <!-- Desk / Radio Table -->
    <rect x="425" y="395" width="255" height="18" fill="#5c3d28" stroke="#1c1917" stroke-width="4"/>
    <rect x="445" y="413" width="16" height="117" fill="#3d281a" stroke="#1c1917" stroke-width="3"/>
    <rect x="645" y="413" width="16" height="117" fill="#3d281a" stroke="#1c1917" stroke-width="3"/>

    <!-- Emergency Radio on Table -->
    <rect x="485" y="348" width="90" height="47" rx="5" fill="#374151" stroke="#111827" stroke-width="3.5"/>
    <rect x="495" y="358" width="42" height="26" fill="#1f2937" stroke="#000" stroke-width="2"/>
    <circle cx="554" cy="365" r="7" fill="#facc15" stroke="#000" stroke-width="2"/>
    <circle cx="554" cy="383" r="5" fill="#ef4444" stroke="#000" stroke-width="1.5"/>
    <line x1="500" y1="348" x2="525" y2="305" stroke="#9ca3af" stroke-width="3"/>
  </g>

  <!-- 4. TEMPAT TIDUR / KASUR (RIGHT SIDE - INTERACTIVE FOR SLEEPING) -->
  <g id="BedArea">
    <!-- Bed Frame Headboard & Footboard -->
    <rect x="920" y="350" width="18" height="180" rx="3" fill="#4a2e1b" stroke="#17100b" stroke-width="4"/>
    <rect x="1225" y="395" width="16" height="135" rx="3" fill="#4a2e1b" stroke="#17100b" stroke-width="4"/>
    <!-- Mattress -->
    <rect x="935" y="420" width="292" height="58" rx="8" fill="#d6d3d1" stroke="#1c1917" stroke-width="3.5"/>
    <!-- Pillow -->
    <ellipse cx="975" cy="415" rx="32" ry="14" fill="#f5f5f4" stroke="#1c1917" stroke-width="3"/>
    <!-- Blanket (Green/Olive Survivor Blanket) -->
    <path d="M1005 418 L1225 418 L1225 480 L995 480 Z" fill="#3f6212" stroke="#1c1917" stroke-width="3.5"/>
    <!-- Bed Frame Base -->
    <rect x="932" y="472" width="298" height="22" fill="#5c3a21" stroke="#17100b" stroke-width="3.5"/>
  </g>

  <!-- HANGING CEILING LAMP & WARM LIGHT OVERLAY -->
  <line x1="640" y1="0" x2="640" y2="85" stroke="#1c1917" stroke-width="4"/>
  <polygon points="605,85 675,85 695,112 585,112" fill="#292524" stroke="#0c0a09" stroke-width="3"/>
  <circle cx="640" cy="114" r="11" fill="#fef08a"/>
  <rect width="1280" height="720" fill="url(#lampGlow)" pointer-events="none"/>
</svg>
